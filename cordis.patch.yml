# dsh-whale-girl bundle patch
#
# `dsh plugin --profile <name> add <path-or-spec>` 安装本包时，命令会把
# `dsh.profile.bundles` 与已安装包对账，看到本声明后把 dsh-whale-girl 追加进
# bundle 栈；profile 启动时合并本 patch（单条 insert），无需手工编辑 profile。
#
# 双挂载守卫：若其他已启用 entry 已经挂载了 dsh-whale-girl（例如聚合 bundle
# 用别的 entry id 挂的），本行退位，由那一份拥有桌宠。

- insert:
    - id: whale-girl
      name: 'dsh-whale-girl'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-whale-girl' && e.options.id !== 'whale-girl' && !e.disabled)"
